services:
  # ============================================================================
  # VisionQC FastAPI Backend API Servisi
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionqc-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/visionqc}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
        required: false
    networks:
      - visionqc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # PostgreSQL Veritabanı Servisi (Yerel / Konteyner Tabanlı)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: visionqc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-visionqc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visionqc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visionqc}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: visionqc_postgres_data

networks:
  visionqc-network:
    name: visionqc-network
    driver: bridge
